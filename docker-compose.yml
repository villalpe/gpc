version: "3.9"

services:
  db:
    image: postgres:16
    container_name: gpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpc_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gpc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gpc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gpc_postgres_data: